# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: 'ko-KR' # 리뷰 언어 설정
early_access: true # 얼리 액세스 기능 활성화

# 리뷰 톤 및 스타일 지정
tone_instructions: |
  한국어 존댓말로 간결하고 건설적인 리뷰를 제공해요.
  블로킹 이슈는 Must, 개선 제안은 Suggest로 구분해요.
  보안, 성능, 유지보수성을 우선하고 실제 코드와 docs 문서를 함께 확인하며, 서로 다른 경우 문서 갱신 필요성을 안내해요.

reviews:
  profile: 'assertive' # 리뷰 스타일: chill(관대), assertive(엄격)
  request_changes_workflow: false # true로 바꾸면 CodeRabbit이 변경 요청 상태를 직접 남길 수 있음
  high_level_summary: true # PR 요약 생성
  poem: false # 시(POEM) 생성 비활성화
  review_status: true # 리뷰 상태 표시
  assess_linked_issues: false # 연결된 이슈 분석 비활성화
  related_prs: false # 관련 PR 표시 비활성화
  suggested_labels: false # 라벨 자동 제안
  changed_files_summary: true # 변경된 파일 요약
  sequence_diagrams: false # 시퀀스 다이어그램 생성 비활성화(기본 노이즈 절감)

  # 워크플로우 개선
  high_level_summary_in_walkthrough: true # 요약을 워크스루에 포함
  high_level_summary_placeholder: '이 PR의 주요 변경사항을 요약합니다'
  collapse_walkthrough: true # 워크스루 섹션 접기(기본은 접어서 노이즈 감소)
  commit_status: true # 커밋 상태 체크
  fail_commit_status: false # 커밋 실패 시 상태 체크 실패하지 않음
  related_issues: false # 관련 이슈 추적 비활성화
  abort_on_close: true # PR 닫힐 때 리뷰 중단

  # 파일 경로 필터링 (단일 Next.js 앱 기준)
  path_filters:
    # 포함(allow-list)
    - 'src/**'
    - 'public/**'
    - 'docs/**'
    - '.github/**'
    - 'package.json'
    - 'postcss.config.mjs'
    - 'next.config.*'
    - 'tsconfig*.json'
    - '.coderabbit.yaml'
    - 'eslint.config.mjs'
    - 'pnpm-workspace.*'
    - 'sentry.*.config.ts'
    - 'Dockerfile'
    - '.dockerignore'
    - 'README.md'
    - '.gitignore'
    # 제외(deny-list)
    - '!node_modules/**'
    - '!.next/**'
    - '!dist/**'
    - '!build/**'
    - '!coverage/**'
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.jpeg'
    - '!**/*.svg'
    - '!**/*.gif'
    - '!**/*.webp'
    - '!**/*.ico'
    - '!*.lock'
    - '!pnpm-lock.yaml'
    - '!package-lock.json'
    - '!yarn.lock'

  # 경로별 특별 지침 (구체적인 패턴부터 일반적인 패턴 순으로 배열)
  path_instructions:
    # 가장 구체적인 패턴들
    - path: '.coderabbit.yaml'
      instructions: |
        CodeRabbit 설정 파일 리뷰 시:
        - YAML 문법 정확성 확인
        - 스키마 호환성 확인(지원되지 않는 필드 사용 여부)
        - path_filters 포함/제외 패턴이 실제 src 구조와 맞는지 확인
        - path_instructions 중복 또는 누락 확인
        - 프로젝트 구조와 설정의 일치성 검토

    - path: 'src/app/**'
      instructions: |
        docs/architecture/app-structure.md 의 레이어 구조를 기준으로 리뷰해요.
        App Router 경계 레이어로서 아래 책임을 중점 확인해요.
        - Next.js 파일 컨벤션 외 로직이 page/layout에 남아있으면 src/domains로 분리 제안
        - "use client"가 leaf component나 providers.tsx 외에 과도하게 사용되는지 확인
        - domains가 app을 import하면 지적

    - path: 'src/domains/**'
      instructions: |
        docs/architecture/app-structure.md 의 레이어 구조를 기준으로 리뷰해요.
        도메인 레이어로서 아래 책임을 중점 확인해요.
        - 하위 구조가 pages-or-flows, components, hooks, api, model 패턴을 따르는지 확인
        - domains -> app 방향 import가 있으면 지적
        - 여러 도메인에서 실제로 재사용되고 의미와 변경 이유가 같을 때 src/shared 이동을 검토

    - path: 'src/shared/**'
      instructions: |
        docs/architecture/app-structure.md 의 레이어 구조를 기준으로 리뷰해요.
        여러 도메인에서 재사용되는 코드만 위치해야 해요.
        - 특정 도메인에서만 쓰일 코드는 src/domains로 이동 제안
        - shared -> domains 방향 import가 있으면 지적

    - path: 'src/lib/**'
      instructions: |
        외부 라이브러리 설정이나 작은 헬퍼만 위치해야 해요.
        - lib -> app, lib -> domains 방향 import가 있으면 지적

    - path: 'src/types/**'
      instructions: |
        앱 전체 공통 타입만 위치해야 해요.
        - 특정 도메인 타입은 domains/{domain}/model로 이동 제안

    # 중간 수준의 구체적인 패턴들
    - path: '**/components/**/*.tsx'
      instructions: |
        docs/conventions/conventions.md 의 컴포넌트 및 접근성 규칙을 기준으로 리뷰해요.
        컴포넌트 props 설계와 접근성을 중점으로 확인해요.

    - path: '**/hooks/**/*.ts'
      instructions: |
        docs/conventions/conventions.md 의 훅 규칙을 기준으로 리뷰해요.
        의존성 배열(exhaustive-deps) 준수와 TanStack Query 훅 네이밍을 중점으로 확인해요.

    - path: '**/api/**/*.ts'
      instructions: |
        docs/conventions/conventions.md 의 API 함수 규칙을 기준으로 리뷰해요.
        에러 처리 누락과 응답 타입 네이밍을 중점으로 확인해요.

    - path: 'src/app/globals.css'
      instructions: |
        docs/architecture/styling.md 의 스타일 규칙을 기준으로 리뷰해요.
        전역성이 명확하지 않은 스타일은 src/shared/components/ui로 분리를 제안해요.

    - path: 'docs/**'
      instructions: |
        문서 리뷰 시:
        코드 변경이 있을 때 관련 문서도 함께 갱신됐는지 확인해요.
        새 규칙은 docs/conventions/ 또는 docs/architecture/ 내 가장 적합한 문서에 추가됐는지 확인해요.

    # 가장 일반적인 패턴 (마지막에 배치)
    - path: '**/*.{ts,tsx}'
      instructions: |
        docs/conventions/conventions.md 의 공통 TypeScript/TSX 컨벤션을 기준으로 리뷰해요.
        네이밍, 타입, import 순서는 문서를 우선 기준으로 삼고, 아래 항목을 추가로 중점 확인해요.
        - API 키, 토큰, 시크릿이 하드코딩돼 있지 않은지 확인(환경 변수 사용 여부)
        - 브라우저 전용 대형 라이브러리나 초기 렌더링에 필요하지 않은 client component는 번들 크기와 사용자 경험을 고려해 dynamic import 적용 여부를 검토
        - Next.js App Router가 기본 제공하는 route 단위 코드 분할에는 불필요한 dynamic import를 제안하지 않음
        - 가독성, 예측 가능성, 응집도, 결합도 관점에서 과도하게 복잡한 코드가 있으면 지적

  auto_review:
    enabled: true # 자동 리뷰 활성화
    drafts: false # 드래프트 PR은 리뷰하지 않음
    ignore_title_keywords: # 특정 키워드가 포함된 PR 제목 무시
      - '[skip-review]'

  # 사전 병합 검사 (PR은 "[작업유형] BDYFE-<번호> 작업 내용" 형식, 엄격도는 warning으로 시작)
  pre_merge_checks:
    title:
      mode: 'warning' # 형식이 안 맞아도 머지는 막지 않고 댓글로만 안내
      requirements: 'PR 제목은 [작업유형] BDYFE-<이슈번호> 형식으로 시작하고, 작업 의도가 드러나게 작성해요. 예: "[Feat] BDYFE-12 로그인 페이지 레이아웃 추가"'
    description:
      mode: 'warning' # PR 설명이 비어있거나 부실하면 안내만
    issue_assessment:
      mode: 'off' # 연결된 이슈 평가 기능은 사용하지 않음

  # 코드 개선 기능(finishing_touches) - 전역 비활성화
  finishing_touches:
    docstrings:
      enabled: false # 자동 docstring 생성 비활성화
    unit_tests:
      enabled: false # 자동 유닛 테스트 생성 비활성화

  # Next.js/TypeScript/Tailwind 환경에 맞는 도구들 (실제 사용하는 것만 활성화)
  tools:
    eslint:
      enabled: true # TypeScript/React 린팅
    stylelint:
      enabled: true # Tailwind 등 CSS 린팅
    languagetool:
      enabled: true # 한국어 문법 검사
      level: 'default'
    markdownlint:
      enabled: true # docs/ 문서 품질 검사
    gitleaks:
      enabled: true # 보안 비밀 정보 스캔
    yamllint:
      enabled: true # YAML 파일 검증
    actionlint:
      enabled: true # GitHub Actions 워크플로우 검증

# 채팅 설정
chat:
  art: false # 아스키/이모지 아트 비활성화(전문성 유지)
  auto_reply: true # 멘션 없이도 댓글 답글에 자동 응답

# 지식 베이스 설정
knowledge_base:
  web_search:
    enabled: true # 웹 검색 기능 활성화
  code_guidelines:
    enabled: true # 레포의 컨벤션 문서를 리뷰 기준으로 사용
    filePatterns:
      - 'README.md'
      - 'docs/index.md'
      - 'docs/architecture/**/*.md'
      - 'docs/conventions/**/*.md'